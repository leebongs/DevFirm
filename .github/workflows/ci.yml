name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Next 16 요구사항: Node.js 20.9+
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next build 는 더 이상 lint 를 실행하지 않으므로(Next 16) 별도 단계로 돌린다
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Content rules (A10 · A11)
        run: pnpm check:content

      - name: Information architecture (A14)
        run: pnpm check:nav

      - name: Color contrast (A6)
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

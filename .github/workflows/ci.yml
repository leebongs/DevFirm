name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    name: 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Next 16 요구사항: Node.js 20.9+
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # next build 는 더 이상 lint 를 실행하지 않으므로(Next 16) 별도 단계로 돌린다
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Content rules (A10 · A11)
        run: pnpm check:content

      - name: Information architecture (A14)
        run: pnpm check:nav

      - name: Color contrast (A6)
        run: pnpm check:contrast

      - name: Build
        run: pnpm build

  e2e:
    name: E2E · 접근성 (A1~A5, A8, A9, A12)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Playwright (6 뷰포트 + axe)
        run: pnpm test:e2e
        env:
          FORM_TOKEN_SECRET: ci-test-secret
          MAIL_TRANSPORT: mock

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (A7)
    runs-on: ubuntu-latest
    needs: static
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lighthouse CI
        run: pnpm dlx @lhci/cli@latest autorun

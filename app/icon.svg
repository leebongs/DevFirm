<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DevFirm">
  <!--
    scripts/generate-logo.mjs 가 생성합니다. 직접 고치지 마세요 —
    헤더 워드마크와 같은 레터폼을 공유해야 하므로 그리드 상수를 고쳐야 합니다.

    색은 사이트 토큰과 같은 값(oklch → sRGB):
      #162e50 = --brand (Firm Navy)
      #f6f9fc = --brand-foreground
      #00bbcb = --highlight (Circuit Cyan)
  -->
  <rect width="64" height="64" rx="14" fill="#162e50"/>
  <g transform="translate(12 14) scale(0.4)" fill="#f6f9fc">
    <path d="M0,2 H17 A35,35 0 0 1 17,72 H0 Z M14,59.5 H17 A22.5,22.5 0 0 0 17,14.5 H14 Z"/>
    <path transform="translate(60 0)" d="M0,2 H40 V14.5 H14 V33 H34 V45.5 H14 V72 H0 Z"/>
  </g>
  <rect x="12" y="47" width="40" height="3" rx="1.5" fill="#00bbcb"/>
</svg>
